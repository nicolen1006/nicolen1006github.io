<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nicole Dai's island portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#8A8F4A; --leaf-deep:#6E7440; --sand:#F7EEDF; --bark:#3A2F45; --bark-dark:#221D33;
  --sky:#221D33; --paper:#F7EEDF; --ink:#2A2230; --muted:#6E6474; --sun:#E86F5A; --peach:#E8A48C;
  --todo-bg:#FBE9E2; --chip:#EFE6D8;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Fraunces",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#27302A; --ink:#EFE9DA; --muted:#B9C0AE; --leaf-deep:#A9D38F; --todo-bg:#3B3128; --chip:#334036;
  }
}
:root[data-theme="dark"]{
  --paper:#27302A; --ink:#EFE9DA; --muted:#B9C0AE; --leaf-deep:#A9D38F; --todo-bg:#3B3128; --chip:#334036;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* labels over places */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.label{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-weight:600;font-size:13px;
  color:var(--bark-dark);background:#FFFBF1;border:2px solid var(--bark);border-radius:10px;padding:2px 9px;white-space:nowrap;
  box-shadow:0 2px 0 var(--bark);transition:opacity .2s}
.label.found{background:#E6F2DA}
.label.found::before{content:"✓ ";color:var(--leaf)}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.badge{background:var(--bark);color:var(--sand);border-radius:16px;padding:8px 14px 10px;box-shadow:0 3px 0 var(--bark-dark)}
.badge .name{font-family:var(--display);font-weight:700;font-size:1.15rem;display:block;line-height:1.2}
.badge .found{font-size:.82rem;opacity:.9}
.dots{display:flex;gap:5px;margin-top:6px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--sand);background:transparent}
.dot.on{background:var(--sun);border-color:var(--sun)}
.hud-actions{display:flex;gap:8px}
.btn{font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--bark-dark);background:#FFFBF1;
  border:2.5px solid var(--bark);border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 var(--bark);
  transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bark)}
.btn.primary{background:var(--sun)}
.btn.round{width:42px;padding:8px 0;text-align:center}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* prompt */
.prompt-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:0 12px calc(22px + env(safe-area-inset-bottom,0px));pointer-events:none}
.prompt{pointer-events:auto;font-size:1.05rem;padding:11px 20px}
.prompt kbd{font-family:var(--display);font-size:.8rem;background:var(--bark);color:var(--sand);border-radius:6px;padding:1px 7px;margin-left:8px}
.hint{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:0 12px calc(26px + env(safe-area-inset-bottom,0px));
  font-weight:700;color:#F7EEDF;text-shadow:0 1px 0 rgba(255,255,255,.7);font-size:.9rem;pointer-events:none;transition:opacity .4s}

.toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);opacity:0;
  background:var(--leaf-deep);color:#fff;font-family:var(--display);font-weight:600;padding:9px 18px;border-radius:999px;
  transition:opacity .3s, transform .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toast{color:#1E2A1A} }

/* card */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(40,60,50,.35)}
.overlay[hidden]{display:none}
.card{width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;background:var(--paper);
  border:3px solid var(--bark);border-radius:22px;box-shadow:0 6px 0 var(--bark-dark);overflow:hidden;
  animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.card{animation:none}.btn{transition:none}}
.sign{background:var(--bark);color:var(--sand);padding:16px 20px 14px;display:flex;align-items:flex-start;gap:12px;
  background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(0,0,0,.06) 13px 15px)}
.sign-text{flex:1;min-width:0}
.sign h2{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.15;margin:0}
.sign .kicker{margin:4px 0 0;font-size:.92rem;opacity:.92}
.sign .btn{flex-shrink:0;font-size:.85rem;padding:6px 14px}
.card-body{padding:18px 22px 24px;overflow-y:auto;line-height:1.6}
.card-body h3{font-family:var(--display);font-weight:600;font-size:1.08rem;color:var(--leaf-deep);margin:18px 0 6px}
.card-body h3:first-child{margin-top:4px}
.card-body p{margin:0 0 10px;max-width:68ch}
.card-body ul{margin:0 0 10px;padding-left:1.2em}
.card-body li{margin-bottom:5px}
.card-body a{color:var(--leaf-deep);font-weight:700}
.role{font-weight:700;color:var(--muted);font-size:.95rem}
.todo{border:2px dashed var(--peach);background:var(--todo-bg);border-radius:12px;padding:9px 12px;font-size:.93rem}
.todo strong{color:#B8603F}
.tablewrap{overflow-x:auto;margin:6px 0 4px;border:2px solid var(--bark);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid rgba(122,82,54,.25)}
th{font-family:var(--display);font-weight:600;background:rgba(122,82,54,.1)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.caption{font-size:.82rem;color:var(--muted);margin:4px 0 10px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 12px}
.node{border:2px solid var(--bark);border-radius:12px;padding:6px 12px;font-weight:700;font-size:.9rem;background:var(--chip)}
.arrow{font-weight:700;color:var(--bark)}
.weeks{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:8px 0 6px!important}
.weeks li{border:2px solid var(--bark);border-radius:12px;padding:7px 9px;font-size:.85rem;background:var(--chip);margin:0}
.weeks b{display:block;font-family:var(--display);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{background:var(--chip);border:1.5px solid rgba(122,82,54,.45);border-radius:999px;padding:3px 11px;font-size:.88rem;font-weight:600}
.controls{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 16px;font-size:.95rem}
.controls dt{font-weight:700}
.controls dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.qv{border-top:2px dashed rgba(122,82,54,.4);padding-top:14px;margin-top:18px}
.qv:first-child{border-top:none;margin-top:0;padding-top:0}
.qv-title{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 2px;color:var(--ink)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);
  font-size:1.2rem;color:var(--bark-dark);background:var(--sky)}
/* film grain and soft vignette */
#grain{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(24,18,48,.42) 100%)}
#grain::after{content:"";position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.portrait{float:right;width:130px;height:173px;object-fit:cover;border-radius:16px;border:3px solid var(--bark);margin:0 0 10px 14px}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Nicole's island. Use the arrow keys or WASD to walk, and E to open a place. The Quick view button shows everything as a page."></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>

<header class="hud">
  <div class="badge">
    <span class="name">Nicole's Island</span>
    <span class="found" id="foundText">0 of 7 places found</span>
    <div class="dots" id="dots"></div>
  </div>
  <div class="hud-actions">
    <button class="btn" id="quickBtn">Quick view</button>
    <button class="btn round" id="helpBtn" aria-label="How to play">?</button>
  </div>
</header>

<div class="hint" id="hint">Walk up to a building to visit it</div>
<div class="prompt-wrap"><button class="btn primary prompt" id="prompt" hidden>Visit <span id="promptName"></span><kbd>E</kbd></button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="sign">
      <div class="sign-text">
        <h2 id="cardTitle"></h2>
        <p class="kicker" id="cardKicker"></p>
      </div>
      <button class="btn" id="closeBtn">Close</button>
    </div>
    <div class="card-body" id="cardBody"></div>
  </div>
</div>

<div class="loading" id="loading">Building the island…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

      <h3>Hi, I'm Nicole!</h3>
          <img class="portrait" src="nicole.jpg" alt="Photo of me!">
      <p>I'm a UC Riverside business graduate from Southern California who loves turning messy processes into clear ones: pulling the data together, setting up the system, and keeping everyone on the same page. Across Pop Mart, UCR ITS, and Alchemy Insurance, I've coordinated 21 teams, tracked 1,000+ tickets, and kept outreach on track for 500+ properties.</p>

shop: {

    html: `
      <p class="role">RoboShop Operations Front-End Intern, March to June 2026</p>
      <p>I helped run operations for Pop Mart's RoboShop vending machines. My main focus was managing my RoboShop teams and providing them with any assistance they needed. A big part of my role was giving my teams suggestions on how to improve their sales performance by providing them restocking data, then using that data to make real decisions.</p>

          <tr><td>Store C</td><td class="num">-8%</td><td class="num">31</td><td class="num">$960</td><td>One machine is enough</td></tr>

    html: `
      <p class="role">RoboShop Operations Front-End Intern, March to June 2026</p>
      <h3>The projects</h3>
      <p>I helped launch two new RoboShop machines: one at Katy Mills in Texas and one at USC in California.</p>

const mats = {};
function M(c, opts){
  const k = c + (opts ? JSON.stringify(opts) : '');
  if(!mats[k]) mats[k] = new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.9, metalness:0, flatShading:true}, opts||{}));
  return mats[k];
}
function add(parent, geo, color, x, y, z, opts){
  const m = new THREE.Mesh(geo, M(color, opts));

}
const box = (w,h,d) => new THREE.BoxGeometry(w,h,d);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ PATTERNS (drawn in code) ============ */
function patternTex(draw, size){
  const c=document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'), size);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.magFilter=THREE.NearestFilter; return t;
}
function gingham(a,b){ return patternTex((x,s)=>{ x.fillStyle=b; x.fillRect(0,0,s,s); x.fillStyle=a; x.globalAlpha=.5; x.fillRect(0,0,s/2,s); x.fillRect(0,0,s,s/2); x.globalAlpha=1; x.fillRect(0,0,s/2,s/2); },16); }
const plankTex = patternTex((x,s)=>{
  for(let i=0;i<4;i++){ x.fillStyle=i%2?'#9A6B4C':'#B07F5D'; x.fillRect(0,i*s/4,s,s/4); x.fillStyle='#6E4A36'; x.fillRect(0,(i+1)*s/4-2,s,2); x.fillRect((i*37+11)%s,i*s/4,2,s/4); }
},64);
const pinkGingham = gingham('#E8839B','#FFF4F2');
function addTex(parent, geo, tex, x,y,z, rx,ry){
  const t=tex.clone(); t.needsUpdate=true; t.repeat.set(rx||1, ry||1);
  const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({map:t, roughness:.9}));
  m.position.set(x||0,y||0,z||0); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}

/* ============ TERRAIN ============ */
// The island is a grid of square tiles. Each letter is one 4x4 tile:
//   ~ water    g ground    u upper terrace    ^ stairs (going up toward the top of the map)    w stream on the terrace
// Rows run from the north edge (top) to the south edge (bottom).
const T = 4, H = 2.4, N = 16, HALF = N*T/2;
const MAP = [
  "~~~~~~~~~~~~~~~~",
  "~~~uuu~~~~ggg~~~",
  "~~guuw~~~~gggg~~",
  "~~gg^~~~~~gggg~~",
  "~ggggggggggggg~~",
  "~gggggggggggggg~",
  "~gggggggggggggg~",
  "~gggggggggggggg~",
  "~gggggggggggggg~",
  "~ggggggggggggg~~",
  "~~ggggggg~~~~~~~",
  "~~gggggggggg~~~~",
  "~~ggggggggggg~~~",
  "~~~ggggggggg~~~~",
  "~~~~ggg~ggg~~~~~",
  "~~~~~~~~~~~~~~~~",
];
function cellAt(x,z){ const i=Math.floor((x+HALF)/T), j=Math.floor((z+HALF)/T); if(i<0||j<0||i>=N||j>=N) return '~'; return MAP[j][i]; }
const colliders = [];
const decks = [];      // bridges and the dock: walkable strips over water
const walkables = [];  // surfaces you can tap to walk to
function onDeck(x,z){
  for(const d of decks){
    const vx=d.bx-d.ax, vz=d.bz-d.az, L2=vx*vx+vz*vz;
    const k=Math.max(0,Math.min(1,((x-d.ax)*vx+(z-d.az)*vz)/L2));
    if(Math.hypot(x-d.ax-vx*k, z-d.az-vz*k)<d.hw) return true;
  }
  return false;
}
function heightAt(x,z){
  const c=cellAt(x,z);
  if(c==='g') return 0;
  if(c==='u') return H;
  if(c==='^'){ const j=Math.floor((z+HALF)/T), z0=-HALF+j*T; return H*Math.max(0,Math.min(1,(z0+T-z)/T)); }
  if(onDeck(x,z)) return 0;
  return null;
}
function canStand(x,z,curH){
  const h=heightAt(x,z); if(h===null || Math.abs(h-curH)>.7) return false;
  for(const [a,b] of [[.3,0],[-.3,0],[0,.3],[0,-.3]]) if(heightAt(x+a,z+b)===null) return false;
  return true;
}

// land blocks with striped "cake layer" cliffs, drawn as a few batched meshes
const GRASS=0x7BAE7C, BANDS=[[0xE7A9A0,.4],[0xF0C9A4,.5],[0xB9806E,.45],[0x8C5E5A,.6]], BOTTOM=-2.3;
const pieces = {};
function piece(color,x,y,z,sx,sy,sz){ (pieces[color]=pieces[color]||[]).push([x,y,z,sx,sy,sz]); }
function column(cx,cz,top,grass){
  if(grass) piece(GRASS,cx,top-.175,cz,T+.04,.35,T+.04);
  let y=grass?top-.35:top, k=0;
  while(y>BOTTOM){ const [c,th]=BANDS[k%BANDS.length], h2=Math.min(th,y-BOTTOM); piece(c,cx,y-h2/2,cz,T-.12,h2,T-.12); y-=h2; k++; }
}
const foam = [];
for(let j=0;j<N;j++) for(let i=0;i<N;i++){
  const c=MAP[j][i]; if(c==='~') continue;
  const cx=-HALF+i*T+T/2, cz=-HALF+j*T+T/2;
  if(c==='g' || c==='^') column(cx,cz,0,true);
  if(c==='u') column(cx,cz,H,true);
  if(c==='w'){ column(cx,cz,H-.7,false); piece(GRASS,cx-T/2+.4,H-.35,cz,.8,.7,T); piece(GRASS,cx+T/2-.4,H-.35,cz,.8,.7,T); }
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([di,dj])=>{
    const n=(MAP[j+dj]||'')[i+di]||'~'; if(n!=='~') return;
    if(dj) foam.push([cx,-.97,cz+dj*(T/2+.18),T+.36,.05,.36]); else foam.push([cx+di*(T/2+.18),-.97,cz,.36,.05,T+.36]);
  });
}
const unitBox = new THREE.BoxGeometry(1,1,1), tmp = new THREE.Object3D();
function batch(list, mat, shadows){
  const m=new THREE.InstancedMesh(unitBox, mat, list.length);
  list.forEach(([x,y,z,sx,sy,sz],n)=>{ tmp.position.set(x,y,z); tmp.scale.set(sx,sy,sz); tmp.rotation.set(0,0,0); tmp.updateMatrix(); m.setMatrixAt(n,tmp.matrix); });
  m.castShadow=m.receiveShadow=!!shadows; scene.add(m); return m;
}
Object.keys(pieces).forEach(c=>{ const m=batch(pieces[c], M(+c), true); if(+c===GRASS) walkables.push(m); });
batch(foam, new THREE.MeshBasicMaterial({color:0xE6E8FA, transparent:true, opacity:.5}), false);

// the plaza in the middle
const plaza=add(scene, cyl(5,5,.08,9), 0xB89A86, 0,.03,0); plaza.castShadow=false; walkables.push(plaza);

// stairs up to the lookout
for(let j=0;j<N;j++) for(let i=0;i<N;i++){
  if(MAP[j][i]!=='^') continue;
  const cx=-HALF+i*T+T/2, z0=-HALF+j*T;
  for(let k=0;k<6;k++){ const h=(k+1)*H/6; const st=add(scene,box(T-.6,h,T/6),0xC9BCCB,cx,h/2,z0+T-(k+.5)*T/6); walkables.push(st); }
  [-1,1].forEach(sx=>{ const w=add(scene,box(.3,.5,T),0xB5A4B8,cx+sx*(T/2-.15),H/2+.1,z0+T/2); w.rotation.x=Math.atan2(H,T); w.scale.z=1.25; });
}

// water with little sparkles, like the reference art
const waterTex = patternTex((x,s)=>{
  x.fillStyle='#56679F'; x.fillRect(0,0,s,s);
  const r=mulberry32(7); for(let n=0;n<14;n++){ x.fillStyle=n%3?'rgba(170,190,240,.55)':'rgba(255,230,240,.6)'; x.fillRect(Math.floor(r()*s),Math.floor(r()*s),6+Math.floor(r()*6),2); }
},64);
waterTex.repeat.set(90,90);
const water = new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({map:waterTex, roughness:.6, emissive:0x141833}));

// stream on the terrace and the waterfall into the lake
const streamTex = waterTex.clone(); streamTex.needsUpdate=true; streamTex.repeat.set(1,1);
const fallTex = patternTex((x,s)=>{
  x.clearRect(0,0,s,s); const r=mulberry32(3);
  for(let n=0;n<26;n++){ x.fillStyle=`rgba(${220+r()*35|0},${230+r()*25|0},255,${.35+r()*.6})`; x.fillRect(Math.floor(r()*s),Math.floor(r()*s),2+Math.floor(r()*3),10+Math.floor(r()*24)); }
},64);
fallTex.repeat.set(1,1.5);
const falls = [];
for(let j=0;j<N;j++) for(let i=0;i<N;i++){
  if(MAP[j][i]!=='w') continue;
  const cx=-HALF+i*T+T/2, cz=-HALF+j*T+T/2;
  // the stream flows south and spills over the edge of the terrace
  const st=new THREE.Mesh(new THREE.BoxGeometry(T-1.6,.1,T), new THREE.MeshStandardMaterial({map:streamTex, emissive:0x1A1F40, roughness:.5})); st.position.set(cx,H-.3,cz); scene.add(st);
  add(scene,new THREE.DodecahedronGeometry(.55,0),0xB9B3C4,cx-.5,H-.1,cz-T/2+.4); add(scene,new THREE.DodecahedronGeometry(.4,0),0xA8A2B8,cx+.6,H-.15,cz-T/2+.3);
  const hgt=H-.3+1, zf=cz+T/2;
  const back=new THREE.Mesh(new THREE.PlaneGeometry(T-1.6,hgt), new THREE.MeshStandardMaterial({color:0x6F82C4, emissive:0x1A1F40})); back.position.set(cx,(H-.3-1)/2,zf+.03); scene.add(back);
  const fall=new THREE.Mesh(new THREE.PlaneGeometry(T-1.6,hgt), new THREE.MeshBasicMaterial({map:fallTex, color:0xDDE6FF, transparent:true, opacity:.9, side:THREE.DoubleSide, depthWrite:false}));
  fall.position.set(cx,(H-.3-1)/2,zf+.08); scene.add(fall);
  for(let n=0;n<7;n++){ const f=new THREE.Mesh(sph(.35,8,6), new THREE.MeshBasicMaterial({color:0xF3F0FF, transparent:true, opacity:.75})); f.position.set(cx-1.1+(n%4)*.7,-.95,zf+.45+Math.floor(n/4)*.4); f.scale.y=.35; scene.add(f); falls.push(f); }
}

// bridges get built automatically wherever a path crosses water
function buildBridge(ax,az,bx,bz){
  const L=Math.hypot(bx-ax,bz-az), g=new THREE.Group();
  g.position.set((ax+bx)/2,0,(az+bz)/2); g.rotation.y=Math.atan2(bx-ax,bz-az); scene.add(g);
  const deck=addTex(g, box(2.4,.16,L), plankTex, 0,.02,0, 1, Math.max(1,Math.round(L/1.4)));
  walkables.push(deck);
  const posts=Math.max(2,Math.round(L/1.3));
  [-1.15,1.15].forEach(x=>{ add(g,box(.1,.1,L),0x7A5236,x,.8,0); for(let k=0;k<=posts;k++) add(g,box(.13,.8,.13),0x7A5236,x,.45,-L/2+k*L/posts); });
  [-1,1].forEach(sz=>[-1.2,1.2].forEach(x=>add(g,cyl(.1,.1,1.3,6),0x6E4A36,x,-.6,sz*(L/2-.6))));
  decks.push({ax,az,bx,bz,hw:1.05});
}

function roof(g,w,d,color,y,h){
  const r = (w/2*1.18)*Math.SQRT2;
  const geo = new THREE.ConeGeometry(r,h,4); geo.rotateY(Math.PI/4);
  const m = add(g,geo,color,0,y+h/2,0); m.scale.z = d/w; return m;
}
function door(g,z,color,x){ add(g,box(1,1.7,.12),color,x||0,.85,z+.03); add(g,sph(.07,6,5),0xE8B84A,(x||0)+.3,.85,z+.12); }
function win(g,x,y,z,w,h){ add(g,box(w||.9,h||.8,.08),0xFFE9A8,x,y,z,{emissive:0xB07A2A}); }

function buildHome(g){

  roof(g,4.4,4,0xC8654F,3,1.8);
  door(g,2,0x8A5A3B);

function distSeg(px,pz,bx,bz){ const t=Math.max(0,Math.min(1,(px*bx+pz*bz)/(bx*bx+bz*bz))); return Math.hypot(px-bx*t,pz-bz*t); }
function landInterior(x,z,m){ for(const [a,b] of [[0,0],[m,0],[-m,0],[0,m],[0,-m],[m,m],[-m,-m],[m,-m],[-m,m]]) if(cellAt(x+a,z+b)!=='g') return false; return true; }
function clearSpot(x,z,pad){
  if(Math.hypot(x,z)<7) return false;
  if(!landInterior(x,z,1)) return false;
  for(const l of LOCS){ if(Math.hypot(x-l.x,z-l.z)<l.r+pad) return false; if(distSeg(x,z,l.front.x,l.front.z)<2.4) return false; }
  if(Math.hypot(x+24,z+3)<4) return false;     // golf green
  for(const h of HOBBY_SPOTS) if(Math.hypot(x-h.x,z-h.z)<h.r+pad*.7) return false;
  if(x>-4 && x<0 && z>-17 && z<-12) return false; // dock entrance
  if(x>-17 && x<-9 && z>-17 && z<-13) return false; // bottom of the stairs
  return true;
}

  else for(let k=0;k<4;k++){ const h=.6+rng()*.5; const rd=add(scene,cyl(.03,.04,h,4),0x7FA06A,x+(rng()-.5)*.4,h/2,z+(rng()-.5)*.4); rd.rotation.z=(rng()-.5)*.3; }
  n++;
}
// lily pads on the lake
for(let i=0,n=0;i<400 && n<14;i++){
  const x=-8+rng()*16, z=-28+rng()*12;
  if(cellAt(x,z)!=='~' || (x>-3.6 && x<-.4) || (x<-5 && z>-20.5 && z<-15)) continue;
  const p=add(scene,cyl(.5,.5,.04,10),0x5F8E6A,x,-.96,z); p.castShadow=false;
  if(n%3===0) add(scene,sph(.14,8,6),0xF7B8CC,x+.15,-.86,z,{emissive:0x3A1A28});
  n++;
}

/* ============ PETALS AND FIREFLIES ============ */
const PETALS = 140;
const petalMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(.14,.09), new THREE.MeshBasicMaterial({color:0xF9C6D6, side:THREE.DoubleSide, transparent:true, opacity:.9}), PETALS);
petalMesh.frustumCulled = false; scene.add(petalMesh);
const petals = [], pm = new THREE.Object3D();
for(let i=0;i<PETALS;i++) petals.push({x:(Math.random()-.5)*56, y:Math.random()*9, z:(Math.random()-.5)*56, sp:.4+Math.random()*.5, ph:Math.random()*6.28, rot:Math.random()*6.28});
function updatePetals(dt){
  petals.forEach((p,i)=>{
    p.y -= p.sp*dt; p.x += (Math.sin(t*.7+p.ph)*.6+.25)*dt; p.z += Math.cos(t*.5+p.ph)*.4*dt; p.rot += dt*1.5;
    const floor = heightAt(p.x,p.z); const fl = floor===null ? -1 : floor;
    if(p.y<fl+.05){ p.y=8+Math.random()*2; p.x=(Math.random()-.5)*56; p.z=(Math.random()-.5)*56; }
    pm.position.set(p.x,p.y,p.z); pm.rotation.set(p.rot,p.rot*.7,p.ph); pm.updateMatrix(); petalMesh.setMatrixAt(i,pm.matrix);
  });
  petalMesh.instanceMatrix.needsUpdate = true;
}
const FF = 70, ffPos = new Float32Array(FF*3), ff = [];
for(let i=0;ff.length<FF && i<2000;i++){
  const x=(Math.random()-.5)*56, z=(Math.random()-.5)*56, h=heightAt(x,z), lake=cellAt(x,z)==='~' && x>-8 && x<8 && z>-28 && z<-16;
  if(h===null && !lake) continue;
  ff.push({x, z, y:(h===null?-.6:h)+.6+Math.random()*1.8, ph:Math.random()*6.28});
}
const ffGeo = new THREE.BufferGeometry(); ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos,3));
const dotCv = document.createElement('canvas'); dotCv.width = dotCv.height = 64;
const dc = dotCv.getContext('2d'), gr = dc.createRadialGradient(32,32,0,32,32,32);
gr.addColorStop(0,'rgba(255,240,190,1)'); gr.addColorStop(.3,'rgba(255,200,120,.6)'); gr.addColorStop(1,'rgba(255,180,100,0)');
dc.fillStyle = gr; dc.fillRect(0,0,64,64);
const fireflies = new THREE.Points(ffGeo, new THREE.PointsMaterial({size:.6, map:new THREE.CanvasTexture(dotCv), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
fireflies.frustumCulled = false; scene.add(fireflies);
function updateFireflies(){
  ff.forEach((f,i)=>{ ffPos[i*3]=f.x+Math.sin(t*.6+f.ph)*.8; ffPos[i*3+1]=f.y+Math.sin(t*1.3+f.ph*2)*.3; ffPos[i*3+2]=f.z+Math.cos(t*.5+f.ph)*.8; });
  ffGeo.attributes.position.needsUpdate = true;
  fireflies.material.opacity = .75 + Math.sin(t*2)*.2;
}
function updateWater(dt){
  waterTex.offset.x += dt*.012; waterTex.offset.y += dt*.006;
  streamTex.offset.y -= dt*.6;
  fallTex.offset.y += dt*1.4;
  falls.forEach((f,i)=>{ f.scale.setScalar(.9+Math.sin(t*4+i)*.12); f.scale.y=.35; });
}

/* ============ CHARACTER (original design) ============ */
const player = new THREE.Group(); scene.add(player);
const SKIN=0xF6D2B8, HAIR=0x1E1A1C, TOP=0xF7F3EE, SKIRT=0x2A2230, BOOTS=0x1F1B1E, BAG=0x8E8C90;
function limb(x,y,color,len,rad,endColor,endGeo){
  const pivot=new THREE.Group(); pivot.position.set(x,y,0); player.add(pivot);
  add(pivot,cyl(rad,rad,len,8),color,0,-len/2,0);
  add(pivot,endGeo,endColor,0,-len-.02,0);
  return pivot;
}
// legs with chunky black boots
const legL=limb(-.15,.58,SKIN,.46,.1,BOOTS,box(.26,.3,.34)), legR=limb(.15,.58,SKIN,.46,.1,BOOTS,box(.26,.3,.34));
[legL,legR].forEach(l=>{ l.children[1].position.set(0,-.38,.03); add(l,box(.29,.08,.4),0x111014,0,-.5,.04); });
// white top and black bubble skirt
add(player,cyl(.29,.34,.5,12),TOP,0,1.05,0);
add(player,cyl(.33,.33,.06,14),SKIRT,0,.82,0);
const skirt=add(player,sph(.48,16,12),SKIRT,0,.66,0,{flatShading:false}); skirt.scale.set(1,.55,1);
// bare arms
const armL=limb(-.42,1.22,SKIN,.46,.08,SKIN,sph(.09,8,6)), armR=limb(.42,1.22,SKIN,.46,.08,SKIN,sph(.09,8,6));
armL.rotation.z=-.15; armR.rotation.z=.15;
// gray shoulder bag
add(player,box(.36,.24,.14),BAG,-.52,.92,-.06);
const strap=add(player,box(.04,.62,.04),BAG,-.4,1.22,-.06); strap.rotation.z=-.35;
// head, face, and long dark hair worn down
const head = new THREE.Group(); head.position.y=1.78; player.add(head);
add(head,sph(.55,16,14),SKIN,0,0,0,{flatShading:false});
add(head,sph(.6,16,12,0,Math.PI*2,0,Math.PI*.5),HAIR,0,.05,0,{flatShading:false}).rotation.x=-.42;
// curtain bangs, parted in the middle
[-1,1].forEach(s=>{ const b=add(head,sph(.3,12,10),HAIR,s*.24,.16,.42,{flatShading:false}); b.scale.set(1.1,.55,.45); b.rotation.z=s*-.55; });
const back = add(head,sph(.6,16,14),HAIR,0,-.1,-.14,{flatShading:false}); back.scale.set(1,1,.78);
const long = new THREE.Mesh(new THREE.CylinderGeometry(.58,.66,1.0,18,1,true,.65,Math.PI*2-1.3), M(HAIR,{flatShading:false,side:THREE.DoubleSide}));
long.position.set(0,-.43,-.04); head.add(long);
[-1,1].forEach(s=>add(head,box(.12,.65,.1),HAIR,s*.43,-.25,.3,{flatShading:false}));
[-.2,.2].forEach(x=>{ add(head,sph(.07,8,6),0x1E1A1C,x,-.06,.5,{flatShading:false}); const c=add(head,sph(.08,8,6),0xF4A6A0,x*1.6,-.18,.44,{flatShading:false}); c.scale.z=.4; });
// hair clips and hoop earrings
[[0xF4B6C8,.24],[0xD9D4E8,.08]].forEach(([c,y])=>{ const clip=add(head,box(.24,.07,.07),c,-.47,y,.36); clip.rotation.z=.5; });
[-1,1].forEach(s=>{ const hoop=add(head,new THREE.TorusGeometry(.07,.014,6,14),0xD9D4E8,s*.54,-.2,.05); hoop.rotation.y=Math.PI/2; });
player.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
player.position.set(0,0,3);

// tap ring
const ring = new THREE.Mesh(new THREE.RingGeometry(.3,.45,24), new THREE.MeshBasicMaterial({color:0xFFFFFF, transparent:true, opacity:0}));
ring.rotation.x=-Math.PI/2; ring.position.y=.08; scene.add(ring);
let ringT = 1;

/* ============ UI ============ */
const $ = id => document.getElementById(id);
const overlay=$('overlay'), cardTitle=$('cardTitle'), cardKicker=$('cardKicker'), cardBody=$('cardBody');
const promptBtn=$('prompt'), promptName=$('promptName'), hint=$('hint'), toast=$('toast');
let modalOpen=false, lastFocus=null;

let found = new Set();
try{ const s = localStorage.getItem('nicole-island-found'); if(s) found = new Set(JSON.parse(s)); }catch(e){}
function saveFound(){ try{ localStorage.setItem('nicole-island-found', JSON.stringify([...found])); }catch(e){} }

const dotsEl=$('dots');
LOCS.forEach(()=>{ const d=document.createElement('span'); d.className='dot'; dotsEl.appendChild(d); });
function updateHud(){
  $('foundText').textContent = `${found.size} of ${LOCS.length} places found`;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on', found.has(LOCS[i].id)));
  LOCS.forEach(l=>{
    const f = found.has(l.id);
    l.marker.material.color.set(f?0x9CCB8A:0xF5C84C);
    l.marker.material.emissive.set(f?0x1E3A14:0x6B5410);
    l.marker.scale.setScalar(f?.65:1);
    if(l.labelEl) l.labelEl.classList.toggle('found', f);
  });
}
function showToast(t){ toast.textContent=t; toast.classList.add('show'); clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove('show'),3200); }

function openCard(title, kicker, html){
  lastFocus = document.activeElement;
  cardTitle.textContent=title; cardKicker.textContent=kicker; cardBody.innerHTML=html; cardBody.scrollTop=0;
  overlay.hidden=false; modalOpen=true;
  for(const k in keys) keys[k]=false; target=null; autoOpen=null;
  $('closeBtn').focus();
}
function closeCard(){
  overlay.hidden=true; modalOpen=false;
  (lastFocus && lastFocus!==document.body ? lastFocus : canvas).focus();
}
$('closeBtn').onclick = closeCard;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeCard(); });
overlay.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeCard(); return; }
  if(e.key==='Tab'){
    const f=[...overlay.querySelectorAll('button,a[href]')]; if(!f.length) return;
    if(e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});

function openLoc(loc){
  const c = CONTENT[loc.id];
  const wasNew = !found.has(loc.id);
  found.add(loc.id); saveFound(); updateHud();
  openCard(c.title, c.kicker, c.html);
  if(wasNew && found.size===LOCS.length) setTimeout(()=>showToast("You found every place on the island!"), 300);
}
function openQuick(){
  const html = LOCS.map(l=>{ const c=CONTENT[l.id]; return `<section class="qv"><h2 class="qv-title">${c.title}</h2><p class="role">${c.kicker}</p>${c.html}</section>`; }).join('');
  openCard("Everything on the island", "The quick version of Nicole's portfolio", html);
}
function openIntro(){
  openCard("Welcome to Nicole's Island", "Operations, project management, and IT",
    `<p>I'm Nicole Dai and welcome to my island! Each building on this island holds a piece of my work. Walk around, visit them all, and see how many you can find.</p>
     <dl class="controls">
       <dt>Walk</dt><dd>Arrow keys or WASD, or tap anywhere on the island</dd>
       <dt>Visit</dt><dd>Press E near a building, or tap the building</dd>
       <dt>In a hurry?</dt><dd>Quick view shows everything as one page</dd>
     </dl>
     <div class="actions"><button class="btn primary" id="startBtn">Start exploring</button><button class="btn" id="introQuick">Open quick view</button></div>`);
  $('startBtn').onclick = closeCard;
  $('introQuick').onclick = openQuick;
  $('startBtn').focus();
}
$('quickBtn').onclick = openQuick;
$('helpBtn').onclick = openIntro;
promptBtn.onclick = ()=>{ if(near) openLoc(near); };

const labelsEl=$('labels');
LOCS.forEach(l=>{ const d=document.createElement('div'); d.className='label'; d.textContent=l.name; labelsEl.appendChild(d); l.labelEl=d; });
updateHud();

/* ============ INPUT ============ */
const keys = {};
let target=null, autoOpen=null, near=null, hintShown=true;
const MOVE = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
addEventListener('keydown', e=>{
  if(modalOpen) return;
  const k = e.key.toLowerCase();
  if(MOVE.includes(k)){ keys[k]=true; target=null; autoOpen=null; e.preventDefault(); return; }
  const onButton = document.activeElement && /^(BUTTON|A)$/.test(document.activeElement.tagName) && document.activeElement!==promptBtn;
  if(k==='e' || ((k==='enter'||k===' ') && !onButton)){ if(near){ e.preventDefault(); openLoc(near); } }
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);
canvas.addEventListener('pointerdown', e=>{
  if(modalOpen) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(clickables, true);
  if(hits.length){
    let o = hits[0].object; while(o && !o.userData.loc) o=o.parent;
    if(o){ const loc=o.userData.loc; if(near===loc){ openLoc(loc); return; } target=loc.front.clone(); autoOpen=loc; stuck=0; return; }
  }
  const surf = ray.intersectObjects(walkables, false);
  const p = new THREE.Vector3();
  if(surf.length) p.copy(surf[0].point); else if(!ray.ray.intersectPlane(ground,p)) return;
  target=p; autoOpen=null; stuck=0; ring.position.set(p.x,p.y+.08,p.z); ringT=0;
});

/* ============ LOOP ============ */
const SPEED=7.5, camOffset=new THREE.Vector3(), camLook=new THREE.Vector3();
let walkPhase=0, stuck=0, facing=0, t=0, groundY=0;
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h;
  const portrait = w/h < .8;
  camera.fov = portrait ? 50 : 40;
  camOffset.set(0, portrait?19:15, portrait?20:17);
  camera.updateProjectionMatrix();
  if(composer){ composer.setSize(w,h); composer.setPixelRatio && composer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5)); }
}
addEventListener('resize', resize); resize();
camera.position.copy(player.position).add(camOffset);

function angleLerp(a,b,f){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*f; }

function update(dt){
  const p = player.position;
  let vx=0, vz=0;
  if(!modalOpen){
    if(keys.w||keys.arrowup) vz-=1; if(keys.s||keys.arrowdown) vz+=1;
    if(keys.a||keys.arrowleft) vx-=1; if(keys.d||keys.arrowright) vx+=1;
    if(!vx && !vz && target){
      const dx=target.x-p.x, dz=target.z-p.z, d=Math.hypot(dx,dz);
      if(d<.3){ target=null; if(autoOpen){ const l=autoOpen; autoOpen=null; openLoc(l); } }
      else { vx=dx/d; vz=dz/d; }
    }
  }
  const len=Math.hypot(vx,vz), moving=len>0;
  if(moving){
    vx/=len; vz/=len;
    const ox=p.x, oz=p.z, curH=groundY;
    let nx=ox+vx*SPEED*dt, nz=oz+vz*SPEED*dt;
    if(!canStand(nx,nz,curH)){ if(canStand(nx,oz,curH)) nz=oz; else if(canStand(ox,nz,curH)) nx=ox; else { nx=ox; nz=oz; } }
    p.x=nx; p.z=nz;
    for(const c of colliders){
      if(c.y!==undefined && Math.abs(c.y-curH)>1) continue;
      const dx=p.x-c.x, dz=p.z-c.z, d=Math.hypot(dx,dz), m=c.r+.45;
      if(d<m && d>1e-4){ p.x=c.x+dx/d*m; p.z=c.z+dz/d*m; }
    }
    if(!canStand(p.x,p.z,curH)){ p.x=ox; p.z=oz; }
    const nh=heightAt(p.x,p.z); if(nh!==null) groundY=nh;
    if(target){
      const moved=Math.hypot(p.x-ox,p.z-oz);
      stuck = moved < SPEED*dt*.25 ? stuck+dt : 0;
      if(stuck>.4){ target=null; if(autoOpen && Math.hypot(p.x-autoOpen.x,p.z-autoOpen.z)<autoOpen.r+3){ const l=autoOpen; autoOpen=null; openLoc(l);} autoOpen=null; stuck=0; }
    }
    facing = angleLerp(facing, Math.atan2(vx,vz), Math.min(1,dt*12));
    player.rotation.y = facing;
    walkPhase += dt*12;
    if(hintShown){ hintShown=false; setTimeout(()=>hint.style.opacity='0',1500); }
  } else {
    walkPhase *= .85;
  }
  const sw = moving ? Math.sin(walkPhase) : 0;
  legL.rotation.x = sw*.7; legR.rotation.x = -sw*.7;
  armL.rotation.x = -sw*.6; armR.rotation.x = sw*.6;
  player.position.y = groundY + (moving ? Math.abs(Math.sin(walkPhase))*.08 : 0);
  head.rotation.z = moving ? 0 : (reduceMotion?0:Math.sin(t*1.6)*.04);

  // nearest place
  let best=null, bd=1e9;
  for(const l of LOCS){ const d=Math.hypot(p.x-l.x,p.z-l.z); if(d<l.r+2.6 && d<bd){ best=l; bd=d; } }
  if(best!==near){
    near=best;
    if(near){ promptName.textContent=near.name; promptBtn.hidden=false; hint.style.opacity='0'; }
    else promptBtn.hidden=true;
  }
 const flick = Math.sin(t*3)*.2 + Math.sin(t*7.3)*.1 + Math.sin(t*13.7)*.05;
  lanternMat.emissiveIntensity = 1 + flick;
  glowMat.opacity = .12 + flick*.05;
  updateWater(dt);
  if(!reduceMotion){ updatePetals(dt); updateFireflies(); } else if(t<.1){ updateFireflies(); }
  if(npc){
    const wp=new THREE.Vector3(); npc.getWorldPosition(wp);
    const dx=p.x-wp.x, dz=p.z-wp.z, d=Math.hypot(dx,dz);
    const arm=npc.userData.arm;
    if(d<6){
      const want=Math.atan2(dx,dz)-npc.parent.rotation.y;
      npc.rotation.y=angleLerp(npc.rotation.y,want,Math.min(1,dt*6));
      arm.rotation.z += ((2.6+Math.sin(t*10)*.35)-arm.rotation.z)*Math.min(1,dt*10);
    } else {
      arm.rotation.z += (.15-arm.rotation.z)*Math.min(1,dt*6);
      npc.rotation.y=angleLerp(npc.rotation.y,0,Math.min(1,dt*3));
    }
  }
  // camera
  camLook.set(p.x, 1+groundY, p.z);
  sky.position.copy(camera.position);
  const want = camLook.clone().add(camOffset);
  camera.position.lerp(want, Math.min(1, dt*4));
  camera.lookAt(camera.position.x-camOffset.x, camera.position.y-camOffset.y+1, camera.position.z-camOffset.z);

  // markers
  LOCS.forEach((l,i)=>{
    if(!reduceMotion){ l.marker.position.y = l.top+.9+Math.sin(t*2+i)*.18; l.marker.rotation.y += dt*1.2; }
  });

  // tap ring
  if(ringT<1){ ringT+=dt*1.6; ring.material.opacity=Math.max(0,1-ringT); ring.scale.setScalar(1+ringT*1.2); }

  // labels
  const w=innerWidth, h=innerHeight, v=new THREE.Vector3();
  LOCS.forEach(l=>{
    v.set(l.x, l.top+1.6, l.z).project(camera);
    const dist = Math.hypot(p.x-l.x, p.z-l.z);
    const show = v.z<1 && dist<22;
    l.labelEl.style.opacity = show ? '1' : '0';
    if(show) l.labelEl.style.transform = `translate(${(v.x+1)/2*w}px, ${(1-v.y)/2*h}px) translate(-50%,-100%)`;
  });
}
document.querySelectorAll('.label').forEach(el=>{ el.style.left='0'; el.style.top='0'; });

const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), .05); t += dt;
  update(dt);
  if(composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
$('loading').remove();
frame();
openIntro();
})();
</script>
</body>
</html>
